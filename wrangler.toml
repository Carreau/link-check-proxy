name = "link-check-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "link-check-proxy"
database_id = "b7f6f64f-2153-4c76-a1cf-49f7608ab463"
migrations_dir = "migrations"

# Public snapshot (/v1/snapshot.json), rebuilt hourly. Create once with
#   wrangler kv namespace create SNAPSHOT
# and paste the printed id here (the id is not a secret).
[[kv_namespaces]]
binding = "SNAPSHOT"
id = "d8dad2e926db43e2b8edc4e341b0feff"

# Lets the cron notice a new deployment and rebuild the snapshot right away.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Secrets (set with `npx wrangler secret put ADMIN_TOKEN`):
#   ADMIN_TOKEN  bootstrap admin credential for /v1/admin/* endpoints
